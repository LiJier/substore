# Substore 兼容配置文件，基于 Mihomo Party 脚本改编
# 保留 DNS、规则提供者、规则和代理组结构
# 移除静态节点，依赖 Substore 订阅提供节点
# 落地节点筛选规则：节点名称包含“落地”、“家宽”，通过组级 dialer-proxy 实现链式代理
# 注意：若链式代理未生效，需在 Substore 中为筛选出的落地节点（名称含“落地”或“家宽”）添加节点级 dialer-proxy: ⚙️ 节点选择

proxy-groups:
  - name: "🔰 模式选择"
    type: select
    proxies:
      - "🕊️ 落地节点"
      - "⚙️ 节点选择"
      - "🔗 全局直连"
    interval: 3600
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false

  - name: "⚙️ 节点选择"
    type: select
    proxies:
      - "♻️ 延迟选优"
    include-all: true
    exclude-filter: "(?i)LJ SG"
    interval: 3600
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://raw.githubusercontent.com/clash-verge-rev/clash-verge-rev.github.io/refs/heads/main/docs/assets/icons/adjust.svg"

  - name: "♻️ 延迟选优"
    type: url-test
    tolerance: 50
    include-all: true
    exclude-filter: "(?i)LJ SG"
    interval: 3600
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://raw.githubusercontent.com/clash-verge-rev/clash-verge-rev.github.io/refs/heads/main/docs/assets/icons/speed.svg"

  - name: "🕊️ 落地节点"
